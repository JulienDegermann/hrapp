services:
    db:
        image: postgres:14-alpine
        container_name: hr_db
        environment:
            DB_CONNECTION: pgsql
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5432:5432"
        # healthcheck:
        #     test: ["CMD-SHELL", "pg_isready -U root -d hr-app"]
        #     interval: 10s
        #     retries: 5
        #     start_period: 30s
        #     timeout: 10s
        volumes:
            - postgres_data:/var/lib/postgresql/data:rw
    mailhog:
        image: mailhog/mailhog
        container_name: hr-mailhog
        ports:
            - "1025:1025"
            - "8025:8025"
        environment:
            MH_STORAGE: memory
    # pgadmin:
    #     image: dpage/pgadmin4
    #     container_name: hr-phpmyadmin
    #     depends_on:
    #         - db
    #     ports:
    #         - "8081:80"
    #     environment:
    #         PMA_HOST: db
    #         PG_PASSWORD: root
    php:
        image: hr-app
        container_name: hr-app-8.3
        depends_on:
            db: 
                condition: service_started
                restart: true
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:80"
        environment:
            DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}
        volumes:
            - .:/var/www/html
volumes:
    postgres_data:
        driver: local

services:
    db:
        image: postgres:14-alpine
        container_name: hr_db
        environment:
            DB_CONNECTION: pgsql
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data:rw
    mailhog:
        image: mailhog/mailhog
        container_name: hr-mailhog
        ports:
            - "1025:1025"
            - "8025:8025"
        environment:
            MH_STORAGE: memory
    php:
        image: hr-app
        container_name: hr-app-8.3
        depends_on:
            db: 
                condition: service_started
                restart: true
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:80"
            - "5173:5173"
        environment:
            DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}
        volumes:
            - .:/var/www/html
volumes:
    postgres_data:
        driver: local
